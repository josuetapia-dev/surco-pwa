<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Surco — Mapa de campo</title>
  <meta name="description" content="Mapa electrónico de cultivos con estado por planta, actividades con foto y GPS, y avisos de pendientes. Funciona sin conexión.">
  <meta name="theme-color" content="#1f5130">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Surco">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- ===================== APP SHELL (parte estática) ===================== -->
  <div class="shell">
    <header class="barra">
      <a class="marca" href="#/mapa" aria-label="Surco, ir al mapa">
        <img src="icons/icon-192.png" alt="" width="36" height="36">
        <span><strong>Surco</strong><small>Finca Tres Ríos · demo</small></span>
      </a>
      <div class="barra-acciones">
        <span id="estado-red" class="chip-red" role="status">En línea</span>
        <button type="button" id="btn-instalar" class="btn btn-claro" hidden>Instalar</button>
      </div>
    </header>

    <nav class="navegacion" aria-label="Secciones">
      <a href="#/mapa" data-ruta="mapa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z M9 3v15 M15 6v15"/></svg>
        <span>Mapa</span>
      </a>
      <a href="#/actividades" data-ruta="actividades">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v14H4z M8 9h8 M8 13h8 M8 17h5"/></svg>
        <span>Actividades</span>
      </a>
      <a href="#/pendientes" data-ruta="pendientes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4z M4 10h16 M8 3v5 M16 3v5"/></svg>
        <span>Pendientes</span>
        <b id="badge-pendientes" class="badge" hidden>0</b>
      </a>
      <a href="#/ajustes" data-ruta="ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M4.9 4.9l2.1 2.1 M17 17l2.1 2.1 M4.9 19.1L7 17 M17 7l2.1-2.1"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>

    <!-- ===================== CONTENIDO DINÁMICO (CSR) ===================== -->
    <main id="vista" tabindex="-1">
      <div class="esqueleto" aria-label="Cargando">
        <div></div><div></div><div></div>
      </div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialogo"></dialog>

  <noscript><p class="panel">Surco necesita JavaScript activado.</p></noscript>
</body>
</html>
