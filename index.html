<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Surco — Mapa de campo</title>
  <meta name="description" content="Mapa electrónico de cultivos con estado por planta, actividades con foto y GPS, y avisos de pendientes. Funciona sin conexión.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Surco">
  <!-- Aplica el tema guardado ANTES de pintar (evita el parpadeo claro→oscuro) -->
  <script>
    (function () {
      var t = localStorage.getItem('surco-tema') || 'sistema';
      if (t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-oscuro', '');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/mapa.css">
  <link rel="stylesheet" href="css/actividades.css">
  <link rel="stylesheet" href="css/pendientes-ajustes.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- ===================== APP SHELL (parte estática) ===================== -->
  <div class="shell">
    <header class="barra">
      <a class="marca" href="#/mapa" aria-label="Surco, ir al mapa">
        <img src="icons/icon-192.png" alt="" width="34" height="34">
        <span><strong>Surco</strong><small>Finca Tres Ríos · demo</small></span>
      </a>
      <div class="barra-acciones">
        <span id="estado-red" class="chip-red" role="status">En línea</span>
        <button type="button" id="btn-tema" class="btn-icono" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
        <button type="button" id="btn-instalar" class="btn btn-primario btn-claro" hidden>Instalar</button>
      </div>
    </header>

    <nav class="navegacion" aria-label="Secciones">
      <p class="nav-grupo">Finca Tres Ríos</p>
      <a href="#/mapa" data-ruta="mapa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13M15 6.5v13"/></svg>
        <span>Mapa</span>
      </a>
      <a href="#/actividades" data-ruta="actividades">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5h6M8.5 3.5h7v2.5h-7z"/><path d="M8.5 5H6.5A1.5 1.5 0 0 0 5 6.5v12A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5v-12A1.5 1.5 0 0 0 17.5 5h-2"/><path d="M9 11h6M9 14.5h6M9 18h3"/></svg>
        <span>Actividades</span>
      </a>
      <a href="#/pendientes" data-ruta="pendientes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
        <span>Pendientes</span>
        <b id="badge-pendientes" class="badge-nav" hidden>0</b>
      </a>
      <a href="#/ajustes" data-ruta="ajustes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        <span>Ajustes</span>
      </a>
    </nav>

    <!-- ===================== CONTENIDO DINÁMICO (CSR) ===================== -->
    <main id="vista" tabindex="-1">
      <div class="esqueleto" aria-label="Cargando">
        <div></div><div></div><div></div>
      </div>
    </main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="dialogo"></dialog>

  <noscript><p class="panel">Surco necesita JavaScript activado.</p></noscript>
</body>
</html>
